[workspace]
resolver = "3"
members = [
    "crates/apex-math",
    "crates/apex-collision",
    "crates/apex-core",
    "crates/apex-telemetry",
    "crates/apex-sandbox",
    "crates/apex-tables",
    "crates/apex-inputbot",
    "crates/apex-iw4l",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
apex-math = { path = "crates/apex-math" }
apex-collision = { path = "crates/apex-collision" }
apex-core = { path = "crates/apex-core" }
apex-telemetry = { path = "crates/apex-telemetry" }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
# Movement constants are transcribed/measured at full f32 precision on purpose.
excessive_precision = "allow"
approx_constant = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

# Simulation code is float-heavy; keep tests fast and representative of release math.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
