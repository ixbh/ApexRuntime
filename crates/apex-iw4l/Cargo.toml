playerstate_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "bfe3c2aa700c06285c12c7cd659e3a5f42468f12" }
trace_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "bfe3c2aa700c06285c12c7cd659e3a5f42468f12" }

